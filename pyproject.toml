[project]
name = "model-steering-lab"
version = "0.1.0"
description = "Experiments in targeted model steering and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "torch>=2.6",
    "transformers>=4.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_steering_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]
